      "primaryEvidence": "tests/e2e/auth.spec.ts::journey_accept_invite_and_sign_in",
      "primaryOwner": "C02",
      "requirementId": "J-001",
      "text": "Preconditions:  - Organization exists; - active Owner/Admin created invitation; - email delivery available.  Main flow:  1. User opens the clean Console sign-in URL; email contains no invitation/Auth credential-bearing link. 2. User requests and enters the email OTP through the pre-auth BFF flow. 3. Backend validates the exact Auth token and one-time BFF bootstrap proof. 4. If the verified user has no active membership and exactly one eligible live invitation, bootstrap selects it. If multiple invitations are eligible, BFF renders only post-auth bounded organization labels plus opaque invitation IDs and requires explicit selection; zero eligible invitations denies. 5. Under rank-1 locks, backend rechecks selected invitation, verified user/ email, expiry/revocation and membership, then atomically registers the application session and activates membership/invitation. 6. Console loads organization context and capabilities. 7. New Admin is sent to onboarding; Reviewer/Viewer is sent to repository or memory view.  Alternate/error flows:  - expired invite → safe reissue request; - revoked invite → generic unavailable state; - existing active member → idempotent sign-in; - disabled member → access denied; - wrong signed-in email → no activation. - concurrent revoke/expire/accept or stale opaque selection → no session or membership mutation; - multiple invitations never auto-select by iteration/order and no organization label is exposed before email verification.  Postconditions:  - the selected membership is active exactly once; unrelated existing memberships are unchanged; - audit receipt; - no GitHub or processing side effect."
    },
