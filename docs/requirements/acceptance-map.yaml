    {
      "case": "BR-005.A1",
      "id": "BR-005.A1",
      "primaryEvidence": "test_operator_paid_authorization_live.py::test_customer_consent_and_chat_cannot_authorize_paid_work",
      "primaryOwner": "B06B",
      "requirementId": "BR-005",
      "text": "Historical import проходит free discovery/source stages и останавливается в `awaiting_approval`. Customer consent сохраняется как tenant-bound approval конкретного BackfillRun с workload, budget ceiling, actor, timestamp и idempotency key. Paid stage начинается только при наличии отдельной Evirion operational authorization для целевого environment.  Для live merged PR:  - `OFF` не создаёт live processing work; - `SOURCE_ONLY` разрешает только Source Envelope и оставляет paid gate closed; - `AUTO_EXTRACT` является persisted customer consent, но каждый реальный Alpha call всё равно требует operational authorization."
    },
    {
      "case": "BR-006.A1",
      "id": "BR-006.A1",
      "primaryEvidence": "test_console_model_call_authorization_live.py::test_logical_authorization_and_bounded_dispatch_matrix",
      "primaryOwner": "B06",
      "requirementId": "BR-006",
      "text": "Каждая logical provider operation — initial или validation repair — получает ровно одну durable authorization. Каждый HTTP dispatch этой operation, включая bounded transport retry, должен быть покрыт её неизменным dispatch allowance:  ```text RepositoryEntitlement == ACTIVE AND RepositoryPolicy allows AND Budget allows AND Required approval satisfied AND Runtime/readiness guards pass AND Paid operational authorization covers phase, attempt, model and budget ```  Техническая linearization point — committed durable authorization для exact:  ```text organization repository job execution phase: initial | validation_repair attempt ordinal canonical request digest provider and provider-account scope server-derived provider idempotency key where supported maximum transport dispatches entitlement/policy versions budget reservation customer consent operational authorization ```  Она сериализуется с entitlement disable. Authorization, committed до disable, может завершить только эту logical operation в пределах expiry и captured dispatch allowance; transport retry переиспользует ту же authorization и не создаёт новую. После commit disable новая logical authorization невозможна. Explicit operational-authorization revoke сильнее: он блокирует любой ещё не начатый dispatch/retry. Database transaction не удерживается во время provider HTTP request."
    },
    {
      "case": "BR-007.A1",
      "id": "BR-007.A1",
      "primaryEvidence": "test_console_model_call_authorization_live.py::test_checkpoint_disable_initial_and_repair_matrix",
      "primaryOwner": "B06",
      "requirementId": "BR-007",
      "text": "Если successful provider response уже checkpointed, последующее entitlement disable не может удалить или оставить orphan response. Validation, admission и persistence завершаются без повторения этого provider phase.  Checkpoint одного phase не разрешает другой phase:  - initial checkpoint валидируется; - если он требует repair и repair checkpoint отсутствует, repair получает отдельную authorization; - если entitlement уже disabled, новый repair call запрещён, а initial invalid response детерминированно завершается как `QUARANTINED` с соответствующими validation issues; - existing repair checkpoint может быть валидирован/persisted без нового call.  Authorized but not dispatched work:  - истёкшая authorization не dispatch-ится; - каждый dispatch имеет append-only ordinal/status; allowance consumption атомарно сериализуется с operational revoke; - committed append со status `started`, непосредственно перед HTTP, является единственной dispatch-start linearization point; отдельного reserved state нет; - dispatched request с неизвестным outcome повторяется автоматически только с той же logical authorization, тем же server-derived provider/account-scoped idempotency key, неизменным request/model digest и подтверждённой provider semantics, если dispatch allowance не исчерпан и operational authorization не revoked/expired; - без такой semantics outcome переводится в operator incident, а не в blind paid retry."
    },
