      "text": "Preconditions:  - member has processing-view capability.  Main flow:  1. User opens Processing Activity. 2. Filters repository/PR/status. 3. Opens row. 4. Console shows job/run/admission summary and bounded error/validation data. 5. Retry action appears only when backend advertises it.  Postconditions:  - view has no processing side effect; - raw source/model payload remains protected."
    },
    {
      "case": "J-008.A1",
      "id": "J-008.A1",
      "primaryEvidence": "tests/e2e/processing-settings.spec.ts::journey_manage_members_with_owner_guard",
      "primaryOwner": "C06",
      "requirementId": "J-008",
      "text": "1. Owner/Admin opens Members. 2. Invites Reviewer/Viewer or requests role change. 3. Backend locks organization membership guard and rechecks live roles. 4. Invite/change writes command receipt and durable workflow/audit. 5. Concurrent demotion/removal cannot leave zero active Owners.  Failure/recovery:  - email delivery failure remains resumable; - revoked/expired invite cannot activate; - Admin cannot create/promote Owner; - final Owner transfer requires explicit new Owner acceptance before old Owner can leave."
    },
    {
      "case": "J-009.A1",
      "id": "J-009.A1",
      "primaryEvidence": "tests/e2e/repositories.spec.ts::journey_reconnect_suspend_or_remove_installation",
      "primaryOwner": "C03",
      "requirementId": "J-009",
      "text": "1. Owner/Admin sees stale/suspended/removed status. 2. Reconnect creates a new one-time setup intent. 3. Successful callback atomically selects one effective installation. 4. Asynchronous sync reaches complete generation before access tombstones. 5. Removed/suspended installation blocks new source authorization immediately.  No entitlement or provenance is deleted. Reconnect does not auto-replay ignored events."
    },
    {
      "case": "J-010.A1",
      "id": "J-010.A1",
      "primaryEvidence": "tests/e2e/processing-settings.spec.ts::journey_recover_failed_or_paused_work",
      "primaryOwner": "C06",
      "requirementId": "J-010",
      "text": "1. User opens failure detail. 2. Backend projection supplies stable error and explicit capability: `NONE | RETRY | RESUME | CONTACT_SUPPORT`. 3. UI exposes only that action. 4. Retry/resume uses durable idempotency receipt and current entitlement/policy/approval checks. 5. Checkpoint reuse occurs before any new provider authorization.  Unknown/unsafe state has no retry CTA."
    },
    {
      "case": "J-011.A1",
      "id": "J-011.A1",
      "primaryEvidence": "tests/e2e/processing-settings.spec.ts::journey_request_and_observe_offboarding",
      "primaryOwner": "C06",
      "requirementId": "J-011",
      "text": "1. Owner submits bounded offboarding request or Operator creates it directly. 2. Operator executes the durable OPS-002 workflow. 3. Invitations/memberships, repository entitlements, policies, customer consents and paid operational authorizations are disabled/revoked. 4. GitHub unbind and any conditionally required Auth revocation reconcile from durable checkpoints; multi-organization users retain unrelated access. 5. New work stops; checkpointed responses follow BR-007. 6. Historical data remains under configured retention/legal policy. 7. Export/erasure, when required, uses the existing separately approved retention/erasure runbook; Console Alpha does not invent an ad-hoc delete. 8. Audit records the offboarding boundary without raw payload."
    },
    {
      "case": "NFR-SEC-001.A1",
      "id": "NFR-SEC-001.A1",
      "primaryEvidence": "tests/security/release-surface.spec.ts::secrets_and_production_debug_surfaces_are_absent",
      "primaryOwner": "I01-C",
      "requirementId": "NFR-SEC-001",
      "text": "Browser bundle and payload contain no:  - service-role key; - GitHub App private key; - installation token; - worker DSN; - provider key; - raw model response; - unrestricted source payload."
    },
    {
      "case": "NFR-SEC-002.A1",
      "id": "NFR-SEC-002.A1",
      "primaryEvidence": "test_console_release_security_live.py::test_full_grant_rls_fk_capability_and_audit_matrix",
      "primaryOwner": "I01-B",
      "requirementId": "NFR-SEC-002",
      "text": "Authorization uses:  1. purpose-built API surface; 2. SQL grants; 3. forced RLS on every new Console-owned tenant table; 4. tenant-aware foreign keys; 5. capability checks; 6. audit.  Existing `organization_memberships` has a documented non-FORCE-RLS exception to avoid recursive membership lookup. Its owner/runtime non-bypass, grants and security-definer helper require explicit regression tests. Obsolete direct authenticated reads of `core` tables are revoked after customer-safe APIs are available; `api.trusted_knowledge` keeps its existing machine-trusted semantics only until EEM-8/03 migrates supported consumers. Before EEM-9/10, accepted but `UNRESOLVED` objects must be absent from every active/trusted projection."
    },
    {
      "case": "NFR-SEC-003.A1",
      "id": "NFR-SEC-003.A1",
      "primaryEvidence": "tests/security/web-boundary.spec.ts::otp_http_only_session_csrf_csp_cache_xss_abuse_dast_matrix",
      "primaryOwner": "I01-C",
      "requirementId": "NFR-SEC-003",
      "text": "Console must implement:  - server-only Supabase Auth session handling with host-scoped `__Host-` access/refresh cookies using `HttpOnly; Secure; SameSite=Lax; Path=/` and no `Domain`, request-local clients and online `getUser(accessToken)` verification in both BFF and backend; - canonical local/staging/production origins and trusted-proxy/TLS policy; local browser/E2E and DAST harnesses preserve the production `__Host-`/ `Secure` contract over a pinned HTTPS origin rather than weakening cookie attributes; - no session-bearing Supabase browser client and no Auth token in browser JavaScript, URL, storage, analytics or logs; - `private, no-store` for authenticated/session-refresh and nonce-bearing pre- auth/Auth/MFA/recovery responses, with no tenant/Auth state in CDN/ISR/router cache; - force-dynamic authenticated Next.js routes, `cache: \"no-store\"` Auth/customer fetches, server-applied refresh/cookie headers, zero/disabled hosting cache TTL, and no module-scope Supabase client or tenant/user state; - no raw HTML or `dangerouslySetInnerHTML`; Markdown disabled in Alpha; - pre-auth-transaction- then live-session-bound HMAC double-submit CSRF, exact Origin/canonical Host, Fetch-Metadata/content-type and trusted-proxy validation for every Route Handler/Server Action mutation; - per-response CSPRNG nonce CSP with `strict-dynamic`, no `unsafe-inline` or `unsafe-eval`, and executable warm-instance nonce/header binding tests; - clickjacking protection; - safe redirect allowlist; - state/nonce for GitHub flows; - output encoding; - bounded input; - route/user/tenant plus direct-Auth OTP/IP/email abuse limits, generic anti-enumeration, CAPTCHA/risk equivalent and alerts; - full-SHA CI Actions, approved registry, deny-by-default install scripts with reviewed build allowlist, lockfile/manifests consistency, dependency-diff review, SBOM/provenance, dependency and secret scanning; - no production source maps, debug overlays/routes, diagnostics or internal API documentation outside an explicitly protected upload channel; - stored/reflected/DOM/mutation XSS and malicious HTML/Markdown/SVG/URL corpus tests; - local baseline plus separately authorized authenticated staging DAST with synthetic roles and zero provider/paid side effects; - assigned manual Auth/session/authorization/CSRF/business-logic charter and independent full-platform penetration-test closure including Console/BFF/Auth before readiness."
    },
    {
      "case": "NFR-SEC-004.A1",
      "id": "NFR-SEC-004.A1",
      "primaryEvidence": "test_console_read_api_live.py::test_role_field_and_action_matrix",
      "primaryOwner": "B09",
      "requirementId": "NFR-SEC-004",
      "text": "| Data/action | owner | admin | Reviewer/member | viewer | |---|---:|---:|---:|---:| | Repository and admitted memory summaries | yes | yes | yes | yes | | Exact evidence | yes | yes | yes | yes | | Aggregate token/cost/latency | yes | yes | no | no | | Bounded validation issue codes | yes | yes | yes | read-only | | Member email/list | yes | yes | no | no | | Usage/Alpha metrics | yes | yes | no | no | | Invite/role/entitlement/policy/paid actions | policy-specific | policy-specific | no | no | | Review/lifecycle actions | yes | yes | yes | no |  Endpoint projections enforce this matrix server-side; UI hiding is not authorization."
    },
    {
      "case": "NFR-PRIV-001.A1",
      "id": "NFR-PRIV-001.A1",
      "primaryEvidence": "test_console_read_api_live.py::test_every_endpoint_obeys_payload_field_allowlist",
      "primaryOwner": "B09",
      "requirementId": "NFR-PRIV-001",
      "text": "List APIs return summary fields only. Detail APIs return only fields necessary for the screen and role."
    },
    {
      "case": "NFR-AUD-001.A1",
      "id": "NFR-AUD-001.A1",
      "primaryEvidence": "test_console_control_foundation_live.py::test_audit_actor_correlation_and_redaction_contract",
      "primaryOwner": "B01A",
      "requirementId": "NFR-AUD-001",
      "text": "Audit actor, organization, action, target, timestamp, result and bounded reason for:  - membership changes; - GitHub binding; - entitlement activation/disable; - policy/limit changes; - backfill approval; - review; - lifecycle; - retry.  No raw customer payload or secrets in audit metadata."
    },
    {
      "case": "NFR-REL-001.A1",
      "id": "NFR-REL-001.A1",
      "primaryEvidence": "test_console_control_foundation_live.py::test_receipt_replay_and_concurrent_duplicate_are_durable",
      "primaryOwner": "B01A",
      "requirementId": "NFR-REL-001",
      "text": "All mutations are idempotent at business boundary. Duplicate browser request, network retry, page reload или worker replay не создаёт duplicate business outcome.  Database-only commands use transactional immutable command receipts. Auth, GitHub and email side effects additionally use durable domain workflow states and idempotent reconciliation."
    },
    {
      "case": "NFR-PERF-001.A1",
      "id": "NFR-PERF-001.A1",
      "primaryEvidence": "test_console_read_api_live.py::test_representative_tenant_query_plans_and_p95",
      "primaryOwner": "B09",
      "requirementId": "NFR-PERF-001",
      "text": "- cursor pagination; - default page size 50, maximum 100; - no unbounded scans; - no per-row N+1; - tenant-first indexes; - measured query plan with at least 1,000 repositories, 10,000 Knowledge Objects and 10,000 processing rows in one synthetic tenant; - initial target: p95 server response under 500 ms for normal paginated reads in staging, excluding GitHub sync and long-running jobs."
    },
    {
      "case": "NFR-PERF-002.A1",
      "id": "NFR-PERF-002.A1",
      "primaryEvidence": "test_console_async_operations_live.py::test_sync_and_import_return_receipts_without_waiting",
      "primaryOwner": "I01-B",
      "requirementId": "NFR-PERF-002",
      "text": "GitHub sync, backfill и extraction asynchronous. Web request возвращает receipt/status resource, а не ждёт completion."
    },
    {
      "case": "NFR-ACC-001.A1",
      "id": "NFR-ACC-001.A1",
      "primaryEvidence": "tests/e2e/accessibility.spec.ts::keyboard_focus_name_status_and_contrast_gate",
      "primaryOwner": "I01-C",
      "requirementId": "NFR-ACC-001",
      "text": "Customer workflows meet WCAG 2.2 AA target:  - keyboard navigation; - visible focus; - semantic headings/landmarks; - labels and error association; - contrast; - non-color status indicators; - screen-reader status announcements."
    },
    {
      "case": "NFR-COMP-001.A1",
      "id": "NFR-COMP-001.A1",
      "primaryEvidence": "tests/unit/test_console_contract.py::test_openapi_compatibility_and_pinned_digest",
      "primaryOwner": "B01",
      "requirementId": "NFR-COMP-001",
      "text": "Console pins exact API contract version. Backend breaking change не deploy-ится до совместимого Console release."
    },
    {
      "case": "NFR-OBS-001.A1",
      "id": "NFR-OBS-001.A1",
      "primaryEvidence": "test_console_control_foundation_live.py::test_correlation_propagation_and_log_redaction",
      "primaryOwner": "B01A",
      "requirementId": "NFR-OBS-001",
      "text": "Для каждого web/API request доступны:  - correlation ID; - organization-safe actor/route/action dimensions; - latency/status; - dependency result; - redacted error code.  Source text, evidence quote, raw response, token и secret не входят в logs по умолчанию."
    },
    {
