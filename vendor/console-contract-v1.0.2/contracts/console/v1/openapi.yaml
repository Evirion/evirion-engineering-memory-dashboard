openapi: "3.1.2"
info:
  title: Evirion Console API
  version: "1.0"
  description: >-
    Authenticated membership, invitation, application-session, and repository
    entitlement API. Every operation resolves live session, membership, and
    capability state.
x-evirion-contract-version: "1.0"
x-evirion-runtime-status: repository-entitlements
x-evirion-request-bounds:
  bearerBytes: 8192
  bodyBytes: 65536
  queryBytes: 4096
x-evirion-rate-limit:
  requests: 60
  windowSeconds: 60
security:
  - consoleBearer: []
tags:
  - name: session
    description: Authenticated application-session context.
  - name: organizations
    description: Organization membership and administration.
  - name: github
    description: GitHub App installation and synchronization.
  - name: repositories
    description: Repository access, entitlement, and processing policy.
  - name: imports
    description: Historical import preparation and execution.
  - name: knowledge
    description: Customer-safe knowledge projections.
  - name: review
    description: Human review commands and history.
  - name: lifecycle
    description: Knowledge lifecycle and correction requests.
  - name: processing
    description: Processing state and bounded retries.
  - name: settings
    description: Customer-visible organization settings.
  - name: metrics
    description: Customer-safe aggregate metrics.
paths:
  /v1/session/context:
    get:
      operationId: getSessionContext
      tags:
        - session
      summary: Resolve live organization and application-session context.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationSelection"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Live organization and session context.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/session/pre-auth:
    post:
      operationId: issueMemberSessionPreAuth
      tags:
        - session
      summary: Issue a one-time pre-auth transaction for an existing member.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPreAuthRequest"
      responses:
        "200":
          description: One-time existing-member pre-auth transaction issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/sessions:
    get:
      operationId: listSelfSessions
      tags:
        - session
      summary: List current and recent application sessions.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Application-session inventory.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/session-revocations:
    post:
      operationId: revokeSelfSessions
      tags:
        - session
      summary: Revoke one or more application sessions.
      x-evirion-versioned: true
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevocationRequest"
      responses:
        "200":
          description: Application deny committed and provider effect scheduled.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationMembers
      tags:
        - organizations
      summary: List live organization members.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Organization member inventory.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    patch:
      operationId: updateOrganizationMembership
      tags:
        - organizations
      summary: Change role, disable a member, or transfer ownership.
      x-evirion-versioned: true
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        "200":
          description: Membership transition receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createOrganizationInvitation
      tags:
        - organizations
      summary: Create an invite-only organization invitation.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "200":
          description: Invitation creation receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: resendOrganizationInvitation
      tags:
        - organizations
      summary: Start a new invitation delivery generation.
      x-evirion-versioned: true
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedInvitationRequest"
      responses:
        "200":
          description: Invitation resend receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: revokeOrganizationInvitation
      tags:
        - organizations
      summary: Revoke a live invitation generation.
      x-evirion-versioned: true
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedInvitationRequest"
      responses:
        "200":
          description: Invitation revocation receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/invitations/{invitationId}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: acceptOrganizationInvitation
      tags:
        - organizations
      summary: Issue a one-time pre-auth transaction for invitation bootstrap.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: One-time pre-auth transaction issued.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/offboarding:
    get:
      operationId: getOrganizationOffboarding
      tags:
        - organizations
      summary: Read the current organization offboarding state.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current offboarding state, or null when none exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
    post:
      operationId: requestOrganizationOffboarding
      tags:
        - organizations
      summary: Request durable partner offboarding for this organization.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationOffboardingRequest"
      responses:
        "200":
          description: Completed offboarding request receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/github/installation:
    get:
      operationId: getGithubInstallation
      tags:
        - github
      summary: Read the current GitHub control-plane status.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Installation access, latest setup intent, and latest sync run.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/github/installation-intents:
    post:
      operationId: startGithubInstallation
      tags:
        - github
      summary: Start a one-time GitHub App installation handoff.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubInstallationStartRequest"
      responses:
        "200":
          description: Completed setup-intent receipt carrying the one-time state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/github/installation-callbacks:
    post:
      operationId: completeGithubInstallation
      tags:
        - github
      summary: Consume the one-time state and bind the GitHub App installation.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubInstallationCallbackRequest"
      responses:
        "200":
          description: Completed installation binding receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/github/sync-runs:
    post:
      operationId: startGithubRepositorySync
      tags:
        - github
      summary: Queue an accessible-repository synchronization run.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubRepositorySyncStartRequest"
      responses:
        "200":
          description: Completed synchronization receipt.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/github/sync-runs/{syncRunId}:
    parameters:
      - $ref: "#/components/parameters/SyncRunId"
    get:
      operationId: getGithubRepositorySync
      tags:
        - github
      summary: Read synchronization progress and result.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Synchronization run progress and result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/repositories:
    get:
      operationId: listRepositories
      tags:
        - repositories
      summary: List customer-safe repository entitlement states.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AfterRepositoryId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Repository entitlement inventory.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/repositories/{repositoryId}:
    get:
      operationId: getRepository
      tags:
        - repositories
      summary: Read one customer-safe repository entitlement state.
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Repository entitlement state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/FoundationError"
        "401":
          $ref: "#/components/responses/FoundationError"
        "403":
          $ref: "#/components/responses/FoundationError"
        "404":
          $ref: "#/components/responses/FoundationError"
        "422":
          $ref: "#/components/responses/FoundationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/FoundationError"
        "503":
          $ref: "#/components/responses/FoundationError"
  /v1/organizations/{organizationId}/repositories/{repositoryId}/activate:
    post:
      operationId: activateRepositoryEntitlement
      tags:
        - repositories
      summary: Activate or reactivate a repository entitlement.
      x-evirion-versioned: true
      security:
        - consoleBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/RepositoryId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryActivationRequest"
      responses:
        "200":
          description: Completed repository activation receipt.
          headers:
            X-Request-ID:
