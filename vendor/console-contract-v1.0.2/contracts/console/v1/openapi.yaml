              x-evirion-sensitivity: customer-safe-summary
            responseCode:
              type: string
              enum:
                - REPOSITORY_IMPORT_CREATED
                - REPOSITORY_IMPORT_APPROVED
                - REPOSITORY_IMPORT_JOB_RETRIED
                - REPOSITORY_IMPORT_PAUSED
                - REPOSITORY_IMPORT_RESUMED
                - REPOSITORY_IMPORT_RESUME_BLOCKED
                - REPOSITORY_IMPORT_CANCELLED
              description: >-
                `REPOSITORY_IMPORT_RESUME_BLOCKED` is returned when a resume is
                forced back to `PAUSED` because source dead-letter work remains.
