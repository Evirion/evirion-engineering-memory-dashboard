components:
  securitySchemes:
    consoleBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Server-forwarded Supabase access token used only to prove identity.
        Runtime authorization must revalidate the exact token online and resolve
        live application-session, membership, and capability state.
  schemas:
    ReviewStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - EDITED
        - USER_REJECTED
      x-evirion-backend-projection: private.b07_effective_review.decision
      x-evirion-sensitivity: customer-safe-summary
    LifecycleState:
      type: string
      enum:
        - UNRESOLVED
        - ACTIVE
        - SUPERSEDED
        - WITHDRAWN
      x-evirion-backend-projection: private.b07_effective_lifecycle.lifecycleState
      x-evirion-sensitivity: customer-safe-summary
    KnowledgeReviewAction:
      type: string
      enum:
        - APPROVE
        - EDIT
        - USER_REJECT
        - REVERT_TO_ORIGINAL_AND_APPROVE
      x-evirion-backend-projection: core.knowledge_reviews.action
      x-evirion-sensitivity: customer-safe-summary
    KnowledgeRejectReasonCode:
      type: string
      enum:
        - INCORRECT
        - NOT_DURABLE
        - UNSUPPORTED
        - TOO_VAGUE
        - DUPLICATE
        - OUTDATED
        - OTHER
      x-evirion-backend-projection: core.knowledge_reviews.reject_reason_code
      x-evirion-sensitivity: customer-safe-summary
    KnowledgeIssueSeverity:
      type: string
      enum:
        - NONE
        - MINOR
        - MAJOR
        - CRITICAL
      x-evirion-backend-projection: core.knowledge_reviews.issue_severity
      x-evirion-sensitivity: customer-safe-summary
    KnowledgeReviewNote:
      type: string
      minLength: 1
      maxLength: 2000
      # Every routine rejects a note that is not `btrim`-stable, so a schema
      # that allowed surrounding whitespace would validate a request the
      # backend then refuses.
      pattern: "^\\S(?:[\\s\\S]*\\S)?$"
      x-evirion-backend-projection: core.knowledge_reviews.note
      x-evirion-sensitivity: customer-safe-detail
    KnowledgeExpectedSequence:
      type: integer
      minimum: 0
      description: >-
        The optimistic token the caller observed. Zero is a legitimate value:
        review sequence zero means PENDING and lifecycle version zero means
        UNRESOLVED, so this is deliberately not the `expectedVersion` shape used
        by resource-versioned mutations.
      x-evirion-backend-projection: private.b07_effective_review.reviewSequence
      x-evirion-sensitivity: customer-safe-summary
    KnowledgeEditPayload:
      type: object
      additionalProperties: false
      description: >-
        The complete editable projection. Every one of the thirteen keys is
        required, because `REV-002` defines an edit as a full reviewed
        derivative rather than a patch. Evidence, source, author, dates, code
        anchors, model, admission and run identifiers, scoring, knowledge status
        and every lifecycle or relation field are never editable and are absent
        here by construction.
      required:
        - knowledgeType
        - problem
        - knowledge
        - designRationale
        - documentedTradeoffs
        - explicitAlternatives
        - constraints
        - invariants
        - failureModes
        - affectedSystems
        - futureImpact
        - answerableQuestions
        - implementationStatus
      properties:
        knowledgeType:
          type: string
          enum:
            - ArchitectureDecision
            - APIBehavior
            - FeatureBehavior
            - Constraint
            - Invariant
            - FailureMode
            - Tradeoff
            - MigrationPattern
            - LifecycleBehavior
            - ConcurrencyBehavior
            - OperationalBehavior
            - CompatibilityRule
            - PerformanceBehavior
            - SecurityBehavior
            - SystemBehavior
            - TechnologyChoice
            - InfrastructureDecision
            - ProcessDecision
            - TeamOwnership
            - ExternalDependency
            - ProductDecision
            - ImplementedTechnicalDetail
          x-evirion-backend-projection: core.knowledge_objects.knowledge_type
          x-evirion-sensitivity: customer-safe-summary
        implementationStatus:
          type: string
          enum:
            - implemented
            - proposed
            - partially_implemented
            - unknown
          x-evirion-backend-projection: core.knowledge_objects.implementation_status
          x-evirion-sensitivity: customer-safe-summary
        problem:
          type: string
          minLength: 1
          maxLength: 20000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        knowledge:
          type: string
          minLength: 1
          maxLength: 20000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        designRationale:
          type: string
          minLength: 1
          maxLength: 20000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        futureImpact:
          type: string
          minLength: 1
          maxLength: 20000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        documentedTradeoffs:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        explicitAlternatives:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        constraints:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        invariants:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        failureModes:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        affectedSystems:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
        answerableQuestions:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 4000
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
    KnowledgeReviewEdit:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - payload
      properties:
        schemaVersion:
          type: string
          const: "1"
          x-evirion-backend-projection: core.knowledge_reviews.edit_schema_version
          x-evirion-sensitivity: customer-safe-summary
        payload:
          $ref: "#/components/schemas/KnowledgeEditPayload"
          x-evirion-backend-projection: core.knowledge_reviews.edited_payload
          x-evirion-sensitivity: customer-safe-detail
    KnowledgeReviewRequest:
      type: object
      additionalProperties: false
      description: >-
        `edit` is required by `EDIT` and forbidden otherwise;
        `rejectReasonCode` is required by `USER_REJECT` and forbidden otherwise;
        `issueSeverity` is required by `EDIT` and `USER_REJECT`. The backend is
        the authority for those combinations and refuses an invalid one with a
        stable identifier rather than a constraint violation.
      required:
        - action
        - expectedReviewSequence
        - expectedLifecycleVersion
      properties:
        action:
          $ref: "#/components/schemas/KnowledgeReviewAction"
          x-evirion-backend-projection: api.record_knowledge_review.p_action
          x-evirion-sensitivity: customer-safe-summary
        expectedReviewSequence:
          $ref: "#/components/schemas/KnowledgeExpectedSequence"
          x-evirion-backend-projection: api.record_knowledge_review.p_expected_review_sequence
          x-evirion-sensitivity: customer-safe-summary
        expectedLifecycleVersion:
          $ref: "#/components/schemas/KnowledgeExpectedSequence"
          x-evirion-backend-projection: api.record_knowledge_review.p_expected_lifecycle_version
          x-evirion-sensitivity: customer-safe-summary
        edit:
          $ref: "#/components/schemas/KnowledgeReviewEdit"
          x-evirion-backend-projection: api.record_knowledge_review.p_edit
          x-evirion-sensitivity: customer-safe-detail
